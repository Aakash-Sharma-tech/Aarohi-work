<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarohi Bhandari ♡ | UX Designer</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        'soft-pink': '#FDF2F8',
                        'cute-pink': '#FBCFE8',
                        'deep-pink': '#EC4899',
                        'soft-yellow': '#FEFCE8',
                        'warm-yellow': '#FEF08A',
                        'text-main': '#4A3034', 
                        'text-muted': '#88676B'
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(236, 72, 153, 0.08)',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        body { 
            background-color: #FAFAFA;
            background-image: linear-gradient(135deg, #FDF2F8 0%, #FEFCE8 50%, #FCE7F3 100%);
            color: #4A3034;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #FBCFE8; border-radius: 10px; }
        
        .blob-shape {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: morph 8s ease-in-out infinite;
        }
        
        @keyframes morph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="antialiased min-h-screen selection:bg-pink-200 selection:text-text-main">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const InstagramIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        );

        const MailIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        );

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white/80 backdrop-blur-md shadow-sm py-3' : 'bg-transparent py-5'}`}>
                    <div className="max-w-5xl mx-auto px-6 flex justify-between items-center">
                        <a href="#" className="text-xl font-serif italic font-medium text-deep-pink hover:opacity-80 transition">
                            Aarohi ♡
                        </a>
                        
                        <div className="flex space-x-6 items-center text-sm">
                            {['About', 'Work', 'Hobbies'].map((item) => (
                                <a key={item} href={`#${item.toLowerCase()}`} className="text-text-main font-medium hover:text-deep-pink transition">
                                    {item}
                                </a>
                            ))}
                            <a href="https://instagram.com/its.aarohibhandari" target="_blank" className="text-text-main hover:text-deep-pink transition ml-2">
                                <InstagramIcon />
                            </a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section id="home" className="pt-32 pb-16 md:pt-40 md:pb-24 px-6 max-w-5xl mx-auto flex flex-col-reverse md:flex-row items-center gap-12">
                    <div className="flex-1 text-center md:text-left">
                        <div className="inline-block px-4 py-1.5 rounded-full bg-yellow-50 text-text-main font-medium text-xs mb-6 border border-yellow-200">
                            ✨ Digital Creator & UX Designer
                        </div>
                        <h1 className="text-4xl md:text-5xl font-serif text-text-main mb-4 leading-tight">
                            Hi, I'm Aarohi <br/>
                            <span className="text-deep-pink italic font-light">designing with empathy</span> <br/>
                            and a touch of soft aesthetics.
                        </h1>
                        <p className="text-base text-text-muted mb-8 max-w-md mx-auto md:mx-0 font-medium">
                            A 24-year-old designer blending logic with beauty. When I'm not wireframing, I'm probably dressing up, hunting for the best iced matcha, or romanticizing little moments. 🌷
                        </p>
                    </div>
                    <div className="flex-1 relative flex justify-center items-center">
                        <div className="absolute w-56 h-56 md:w-80 md:h-80 bg-gradient-to-tr from-pink-200 to-yellow-100 rounded-full blur-3xl opacity-50 z-0"></div>
                        
                        <div className="relative w-56 h-56 md:w-72 md:h-72 blob-shape overflow-hidden border-4 border-white shadow-soft z-10">
                            <img 
                                src="first.png" 
                                alt="Aarohi Bhandari" 
                                className="w-full h-full object-cover"
                            />
                        </div>
                    </div>
                </section>
            );
        };

        const About = () => {
            return (
                <section id="about" className="py-16 px-6">
                    <div className="max-w-5xl mx-auto glass-card rounded-[2rem] p-8 md:p-12 shadow-sm">
                        <div className="grid md:grid-cols-2 gap-10 items-center">
                            <div>
                                <h2 className="text-2xl md:text-3xl font-serif mb-4 text-deep-pink">More about me ♡</h2>
                                <p className="text-text-muted mb-4 leading-relaxed">
                                    I believe digital products shouldn't feel cold. My design philosophy is rooted in bringing warmth, intuition, and elegant simplicity to everyday apps and websites.
                                </p>
                                <p className="text-text-muted leading-relaxed">
                                    Based in the tech world but constantly inspired by fashion, art, and the cozy corners of cafés. I aim to create interfaces that feel as comfortable and welcoming as your favorite coffee shop.
                                </p>
                            </div>
                            
                        </div>
                    </div>
                </section>
            );
        };

        const Portfolio = () => {
            const projects = [
                {
                    title: "Aura Beauty App",
                    desc: "A pastel-themed beauty commerce app focused on personalized skincare routines and an intuitive checkout flow.",
                    tags: ["UX Research", "UI Design", "Mobile App"],
                    image: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                },
                {
                    title: "Wanderlust Travel App",
                    desc: "An elegant trip-planning interface helping users curate aesthetic weekend getaways and organize itineraries seamlessly.",
                    tags: ["Interaction Design", "Wireframing"],
                    image: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                },
                {
                    title: "Café Connect",
                    desc: "A location-based social app for finding aesthetic coffee shops, featuring ambient map styles and photo-first reviews.",
                    tags: ["App Design", "User Testing"],
                    image: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                },
                {
                    title: "FinEase Minimalist Tracker",
                    desc: "Transforming complex financial data into a clean, calming dashboard that reduces money anxiety for young professionals.",
                    tags: ["Web App", "Visual Design"],
                    image: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                }
            ];

            return (
                <section id="work" className="py-20 px-6">
                    <div className="max-w-5xl mx-auto">
                        <div className="mb-12 text-center md:text-left">
                            <h2 className="text-3xl font-serif mb-2">Selected Work ✨</h2>
                            <p className="text-text-muted">A collection of interfaces designed with empathy.</p>
                        </div>
                        
                        <div className="grid md:grid-cols-2 gap-8">
                            {projects.map((project, index) => (
                                <div key={index} className="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-soft transition-all duration-300 border border-pink-50 flex flex-col group">
                                    <div className="h-48 overflow-hidden bg-pink-50 relative">
                                        <div className="absolute inset-0 bg-black/5 z-10 transition-colors group-hover:bg-transparent"></div>
                                        <img src={project.image} alt={project.title} className="w-full h-full object-cover transform transition-transform duration-700 group-hover:scale-105" />
                                    </div>
                                    <div className="p-6 md:p-8 flex-1 flex flex-col bg-white">
                                        <h3 className="text-xl font-serif font-medium mb-2">{project.title}</h3>
                                        <p className="text-text-muted text-sm leading-relaxed mb-6 flex-1">
                                            {project.desc}
                                        </p>
                                        <div className="flex flex-wrap gap-2 mt-auto">
                                            {project.tags.map(tag => (
                                                <span key={tag} className="text-[11px] uppercase tracking-wider font-semibold px-3 py-1 bg-pink-50 text-deep-pink rounded-full border border-pink-100">
                                                    {tag}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Hobbies = () => {
            const hobbies = [
                {
                    icon: "👗",
                    title: "Fashion & Styling",
                    desc: "Curating soft aesthetic looks, mixing traditional elegance with comfortable, classy western fits.",
                    bgColor: "bg-pink-50",
                    borderColor: "border-pink-100"
                },
                {
                    icon: "📸",
                    title: "Travel & Photography",
                    desc: "Documenting little everyday moments, beautiful landscapes, and keeping visual diaries of my trips.",
                    bgColor: "bg-yellow-50",
                    borderColor: "border-yellow-100"
                },
                {
                    icon: "🍵",
                    title: "Café Hopping",
                    desc: "Always on the hunt for the perfect iced matcha, aesthetic interiors, and cozy corners to unwind.",
                    bgColor: "bg-pink-50",
                    borderColor: "border-pink-100"
                }
            ];

            return (
                <section id="hobbies" className="py-16 px-6">
                    <div className="max-w-5xl mx-auto text-center">
                        <h2 className="text-3xl font-serif mb-2">Outside of Figma 🌷</h2>
                        <p className="text-text-muted mb-10">Things that make me happy and inspire my daily life.</p>
                        
                        <div className="grid md:grid-cols-3 gap-6">
                            {hobbies.map((hobby, index) => (
                                <div key={index} className={`${hobby.bgColor} ${hobby.borderColor} border rounded-3xl p-8 text-center transition-transform hover:-translate-y-1 duration-300`}>
                                    <div className="text-4xl mb-4">{hobby.icon}</div>
                                    <h3 className="text-lg font-serif font-medium mb-3 text-text-main">{hobby.title}</h3>
                                    <p className="text-sm text-text-muted leading-relaxed">
                                        {hobby.desc}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="py-12 mt-10 px-6">
                <div className="max-w-5xl mx-auto flex flex-col items-center justify-center text-center">
                    <div className="w-16 h-px bg-pink-200 mb-8"></div>
                    <h2 className="text-2xl font-serif italic mb-6 text-deep-pink">Aarohi ♡</h2>
                    
                    <div className="flex space-x-6 mb-8">
                        <a href="mailto:hello@aarohi.design" className="text-text-muted hover:text-deep-pink transition flex items-center gap-2 text-sm">
                            <MailIcon /> hello@aarohi.design
                        </a>
                        <a href="https://instagram.com/hey.aarohi" target="_blank" className="text-text-muted hover:text-deep-pink transition flex items-center gap-2 text-sm">
                            <InstagramIcon /> @hey.aarohi
                        </a>
                    </div>
                    
                    <p className="text-xs text-text-muted opacity-70">
                        Designed with love & coffee.<br/>
                        © {new Date().getFullYear()} Aarohi Bhandari. All rights reserved.
                    </p>
                </div>
            </footer>
        );

        const App = () => {
            return (
                <div className="relative font-sans text-text-main">
                    <Navbar />
                    <main>
                        <Hero />
                        <About />
                        <Portfolio />
                        <Hobbies />
                    </main>
                    <Footer />
                </div>
            );
        };

        // Mount the React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
